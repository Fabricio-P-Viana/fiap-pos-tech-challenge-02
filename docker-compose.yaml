services:
  app:
    build: .
    image: fabriciopereiraviana/tech-challenge-02:latest
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    volumes:
      - .:/usr/src/app
    command: npm start
    depends_on:
      - db
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    env_file:
      - ./.env
